# Bash configuration, loaded when workspace-wallpaper.sh starts.
LOCKFILE="/tmp/workspace-wallpaper.lock"
WALLPAPER_FPS=10
WALLPAPER_SCALING="fill"
# Seconds to wait for workspace migration after monitor changes.
MONITOR_SETTLE_DELAY=0.2

declare -A WALLPAPERS=(
