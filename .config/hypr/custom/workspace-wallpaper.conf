    [2]="3391355116"
    [3]="2964778792"
    [4]="3537802173"
    # punishing gray raven
    [5]="3313102203"
    # violet
    [6]="2645609166"
    # kitan
    [7]="3344732182"
    # bang
    [8]="3424923938"
    # violet
    [9]="3379081947"
)

# Used for workspaces without an entry above; can be any wallpaper ID.
DEFAULT_WALLPAPER="${WALLPAPERS[1]}"
