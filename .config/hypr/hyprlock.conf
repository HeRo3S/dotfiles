general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldColors, 1, 2, easeOut
    animation = inputFieldDots, 1, 4, smooth
}

background {
    monitor =
    path = screenshot
    color = rgba(171923ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 88
    font_family = Sans
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000040)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(a9b1d6ff)
    font_size = 18
    font_family = Sans
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(c0caf5ff)
    font_size = 16
    font_family = Sans
    position = 0, -35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    position = 0, -95
    halign = center
    valign = center
    inner_color = rgba(24283be6)
    outer_color = rgba(7aa2f780) rgba(bb9af780) 45deg
    font_color = rgba(c0caf5ff)
    font_family = Sans
    outline_thickness = 2
    rounding = 18
    dots_size = 0.2
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Enter password
    check_color = rgba(9ece6aff)
    check_text = Unlocking...
    fail_color = rgba(f7768eff)
    fail_text = $FAIL
    capslock_color = rgba(e0af68ff)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000040)
}

label {
    monitor =
    text = Type your password to unlock
    color = rgba(a9b1d6cc)
    font_size = 12
    font_family = Sans
    position = 0, -155
    halign = center
    valign = center
}
